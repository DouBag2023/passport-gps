<!DOCTYPE html>
<html lang="zh">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>AI 工牌定位推送</title>
<style>
  body{font-family:system-ui,-apple-system,sans-serif;background:#0b0f14;color:#e6eef7;margin:0;padding:16px;max-width:480px;margin:0 auto}
  h1{font-size:20px;margin:0 0 6px}
  p{font-size:13px;color:#9aa7b5;margin:4px 0 12px}
  .btn{display:block;width:100%;padding:14px;margin:9px 0;font-size:16px;border:none;border-radius:10px;cursor:pointer;color:#fff}
  .b1{background:#2d5bff}.b2{background:#1f7a4d}.b3{background:#6a39d6}.b4{background:#333c47}
  .btn:disabled{background:#333;color:#777;cursor:default}
  .sep{font-size:12px;color:#7a8796;text-align:center;margin:14px 0 8px}
  .row{display:flex;gap:10px;margin:6px 0}
  .row input{flex:1;min-width:0;padding:12px;font-size:15px;border:1px solid #2a3542;border-radius:10px;background:#11171f;color:#e6eef7}
  .keys input{width:100%;box-sizing:border-box;padding:10px;font-size:13px;margin:5px 0;border:1px solid #2a3542;border-radius:8px;background:#11171f;color:#e6eef7}
  #status{font-size:14px;margin-top:14px;line-height:1.5;white-space:pre-wrap;word-break:break-all}
  .ok{color:#4caf50}.err{color:#ff5252}.info{color:#9aa7b5}.warn{color:#ffb74d}
  details{margin:6px 0}summary{font-size:13px;color:#9aa7b5;cursor:pointer;padding:6px 0}
</style>
</head>
<body>
<h1>AI 工牌 · 定位推送</h1>
<p>把坐标与时间发送到 AI 工牌用于星图定位。无 Google 服务的国行手机请用“高德城市定位”（IP，免 GPS）。</p>

<details class="keys" id="keyBox">
  <summary>高德 Key 设置（首次使用点开，填一次自动记住）</summary>
  <input id="inKey" type="text" placeholder="高德 Key，服务平台必须选「Web端(JS API)」" autocomplete="off">
  <input id="inSec" type="text" placeholder="高德安全密钥 securityJsCode" autocomplete="off">
</details>

<button class="btn b1" id="btnConnect">1. 连接工牌</button>
<button class="btn b2" id="btnAmap" disabled>2. 高德城市定位（IP，免 GPS，推荐）</button>
<button class="btn b3" id="btnGps" disabled>3. 浏览器 GPS 精确定位（需 Google 服务，国行常失败）</button>

<div class="sep">— 也可直接手动输入坐标 —</div>
<div class="row">
  <input id="inLat" type="text" inputmode="decimal" value="31.239752" placeholder="纬度 lat">
  <input id="inLon" type="text" inputmode="decimal" value="121.499588" placeholder="经度 lon">
</div>
<button class="btn b4" id="btnManual" disabled>发送坐标到工牌</button>
<div id="status">先点“连接工牌”，在蓝牙列表选择 AI-Passport。</div>

<script>
var SERVICE = '0000fff0-0000-1000-8000-00805f9b34fb';  // 固件服务 0xFFF0
var CHAR    = '0000fff1-0000-1000-8000-00805f9b34fb';  // 固件可写特征 0xFFF1
var $ = function(id){ return document.getElementById(id); };
var btnC=$('btnConnect'), btnA=$('btnAmap'), btnG=$('btnGps'), btnM=$('btnManual');
var inLat=$('inLat'), inLon=$('inLon'), inKey=$('inKey'), inSec=$('inSec'), st=$('status');
var char=null;

/* 回填保存的高德 key */
inKey.value = localStorage.getItem('amap_key') || '';
inSec.value = localStorage.getItem('amap_sec') || '';
function saveKeys(){ localStorage.setItem('amap_key', inKey.value.trim()); localStorage.setItem('amap_sec', inSec.value.trim()); }
inKey.addEventListener('change', saveKeys); inSec.addEventListener('change', saveKeys);

function log(t,c){ st.className=c||'info'; st.textContent=t; }

/* ===== 蓝牙连接 ===== */
btnC.onclick = async function(){
  if(!navigator.bluetooth){ log('此浏览器不支持 Web Bluetooth，请用手机 Chrome / Edge。','err'); return; }
  try{
    log('请在弹出列表选择 AI-Passport…');
    var device = await navigator.bluetooth.requestDevice({filters:[{services:[SERVICE]}], optionalServices:[SERVICE]});
    log('已选择 '+device.name+'，正在连接…');
    var server = await device.gatt.connect();
    var svc = await server.getPrimaryService(SERVICE);
    char = await svc.getCharacteristic(CHAR);
    btnA.disabled=false; btnG.disabled=false; btnM.disabled=false;
    log('已连接 '+device.name+'。现在可点高德城市定位 / GPS / 手动，坐标会自动写入工牌。','ok');
    device.addEventListener('gattserverdisconnected', function(){
      char=null; btnA.disabled=btnG.disabled=btnM.disabled=true;
      log('蓝牙已断开，请重新连接。','err');
    });
  }catch(e){ log('连接失败：'+e.message,'err'); }
};

/* ===== 统一写坐标 ===== */
function sendCoord(lat, lon, note){
  if(!char){ log('请先连接工牌。','err'); return; }
  var ts=Math.floor(Date.now()/1000);
  var payload=lat+','+lon+','+ts;
  log('正在写入工牌… '+payload+(note?('  ['+note+']'):''));
  var p = char.writeValueWithResponse ? char.writeValueWithResponse(new TextEncoder().encode(payload))
                                      : char.writeValue(new TextEncoder().encode(payload));
  p.then(function(){ log('已发送 '+lat+','+lon+'\n'+new Date(ts*1000).toLocaleString()+(note?'（'+note+'）':'')+'\n工牌星图位置已更新。','ok'); })
   .catch(function(e){ log('发送失败：'+e.message,'err'); });
}
function applyCoord(lat, lon, note){
  inLat.value=lat; inLon.value=lon;
  if(char) sendCoord(lat,lon,note);
  else log((note?note+' ':'')+'坐标 '+lat+','+lon+' 已填入，连接工牌后点“发送坐标”。','info');
}

/* ===== GCJ-02(高德) → WGS-84(GPS/天文) ===== */
var GCJ_A=6378240.0, GCJ_EE=0.00669342162296594323, GCJ_PI=3.14159265358979324;
function tLat(x,y){var r=-100+2*x+3*y+0.2*y*y+0.1*x*y+0.2*Math.sqrt(Math.abs(x));
  r+=(20*Math.sin(6*x*GCJ_PI)+20*Math.sin(2*x*GCJ_PI))*2/3;
  r+=(20*Math.sin(y*GCJ_PI)+40*Math.sin(y/3*GCJ_PI))*2/3;
  r+=(160*Math.sin(y/12*GCJ_PI)+320*Math.sin(y*GCJ_PI/30.0))*2/3; return r;}
function tLng(x,y){var r=300+x+2*y+0.1*x*x+0.1*x*y+0.1*Math.sqrt(Math.abs(x));
  r+=(20*Math.sin(6*x*GCJ_PI)+20*Math.sin(2*x*GCJ_PI))*2/3;
  r+=(20*Math.sin(x*GCJ_PI)+40*Math.sin(x/3*GCJ_PI))*2/3;
  r+=(150*Math.sin(x/12*GCJ_PI)+300*Math.sin(x/30*GCJ_PI))*2/3; return r;}
function gcj02ToWgs84(lng,lat){
  if(lng<72.004||lng>137.8347||lat<0.8293||lat>55.8271) return [lng,lat];
  var dLat=tLat(lng-105,lat-35), dLng=tLng(lng-105,lat-35);
  var rad=lat/180*GCJ_PI, magic=Math.sin(rad); magic=1-GCJ_EE*magic*magic; var sm=Math.sqrt(magic);
  dLat=(dLat*180)/((GCJ_A*(1-GCJ_EE))/(magic*sm)*GCJ_PI);
  dLng=(dLng*180)/(GCJ_A/sm*Math.cos(rad)*GCJ_PI);
  return [lng*2-(lng+dLng), lat*2-(lat+dLat)];   // [wgsLng, wgsLat]
}

/* ===== 动态加载高德 JSAPI ===== */
function loadAmap(cb){
  if(window.AMap && AMap.CitySearch){ cb(); return; }
  var key=inKey.value.trim(), sec=inSec.value.trim();
  if(!key){ log('请先展开“高德 Key 设置”填入 Web端(JS API) Key。','err'); return; }
  saveKeys();
  window._AMapSecurityConfig = sec ? { securityJsCode: sec } : undefined;
  log('正在加载高德定位服务…');
  var s=document.createElement('script');
  s.src='https://webapi.amap.com/maps?v=2.0&key='+encodeURIComponent(key)+'&plugin=AMap.CitySearch,AMap.Geolocation';
  s.onload=function(){ cb(); };
  s.onerror=function(){ log('高德脚本加载失败：检查 Key 是否填对、网络能否访问 webapi.amap.com。','err'); };
  document.head.appendChild(s);
}

/* ===== 高德 IP 城市定位（不依赖 GPS/GMS）===== */
btnA.onclick = function(){
  loadAmap(function(){
    AMap.plugin('AMap.CitySearch', function(){
      var cs=new AMap.CitySearch();
      log('正在通过 IP 获取城市…');
      cs.getLocalCity(function(status, result){
        try{
          if(status==='complete' && result && result.rectangle){
            var xy=result.rectangle.split(';');
            var a=xy[0].split(',').map(Number), b=xy[1].split(',').map(Number);
            var gcjLng=(a[0]+b[0])/2, gcjLat=(a[1]+b[1])/2;
            var w=gcj02ToWgs84(gcjLng,gcjLat);          // [lng,lat] WGS-84
            var lat=w[1].toFixed(6), lng=w[0].toFixed(6);
            var name=[result.province, result.city].filter(function(x){return x&&typeof x==='string';}).join('');
            applyCoord(lat,lng,'高德IP·'+(name||'城市中心')+'·城市级');
          }else{
            log('高德 IP 定位未返回坐标（status='+status+'，info='+(result&&result.info)+'）。可手动输入坐标。','err');
          }
        }catch(err){ log('解析高德结果出错：'+err.message,'err'); }
      });
    });
  });
};

/* ===== 浏览器原生 GPS（有 GMS 才可用；先高精度后降级，带硬超时）===== */
function nativeOnce(high, cb){
  navigator.geolocation.getCurrentPosition(cb, function(e){
    if(high){ log('高精度不可用，尝试低精度…','info'); nativeOnce(false,cb); }
    else cb({__err:e});
  }, { enableHighAccuracy:high, timeout:20000, maximumAge:30000 });
}
btnG.onclick = function(){
  if(!navigator.geolocation){ log('浏览器不支持定位。','err'); return; }
  log('正在获取浏览器 GPS（国行无 Google 服务手机通常会 code=2）…');
  var done=false;
  var timer=setTimeout(function(){ if(!done){done=true; log('定位超时/无响应，建议改用高德城市定位或手动。','err'); } }, 26000);
  nativeOnce(true, function(pos){
    if(done) return; done=true; clearTimeout(timer);
    if(pos.__err){ var e=pos.__err;
      log('GPS 失败 code='+e.code+'：'+e.message+'\n（code=2 即无 Google 服务定位源，请用高德城市定位）','err'); return; }
    var c=pos.coords;
    applyCoord(c.latitude.toFixed(6), c.longitude.toFixed(6), '浏览器GPS·精度'+Math.round(c.accuracy)+'m');
  });
};

/* ===== 手动发送 ===== */
btnM.onclick = function(){
  var lat=parseFloat(inLat.value), lon=parseFloat(inLon.value);
  if(isNaN(lat)||isNaN(lon)||Math.abs(lat)>90||Math.abs(lon)>180){ log('请输入有效经纬度（纬度 -90~90，经度 -180~180）。','err'); return; }
  sendCoord(lat.toFixed(6), lon.toFixed(6), '手动');
};
</script>
</body>
</html>
