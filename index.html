<!DOCTYPE html>
<html lang="zh">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>AI 工牌定位推送</title>
<style>
  body{font-family:system-ui,-apple-system,sans-serif;background:#0b0f14;color:#e6eef7;margin:0;padding:16px;max-width:480px;margin:0 auto}
  h1{font-size:20px;margin:0 0 6px}
  p{font-size:13px;color:#9aa7b5;margin:4px 0 12px}
  .btn{display:block;width:100%;padding:14px;margin:10px 0;font-size:16px;border:none;border-radius:10px;cursor:pointer;color:#fff;background:#2d5bff}
  .btn.sec{background:#1f7a4d}
  .btn:disabled{background:#333;color:#777;cursor:default}
  .sep{font-size:12px;color:#7a8796;text-align:center;margin:16px 0 8px}
  .row{display:flex;gap:10px}
  .row input{flex:1;min-width:0;padding:12px;font-size:16px;border:1px solid #2a3542;border-radius:10px;background:#11171f;color:#e6eef7}
  #status{font-size:14px;margin-top:14px;line-height:1.5;white-space:pre-wrap;word-break:break-all}
  .ok{color:#4caf50}.err{color:#ff5252}.info{color:#9aa7b5}
</style>
</head>
<body>
<h1>AI 工牌 · 定位推送</h1>
<p>把坐标与时间发送到 AI 工牌，用于星图定位。需使用 Chrome / Edge 打开。</p>
<button class="btn" id="btnConnect">1. 连接蓝牙</button>
<button class="btn" id="btnGps" disabled>2. 发送我的位置（浏览器定位）</button>
<div class="sep">— 定位不可用 / 电脑端，可直接手动输入坐标 —</div>
<div class="row">
  <input id="inLat" type="text" inputmode="decimal" value="31.239752" placeholder="纬度 lat">
  <input id="inLon" type="text" inputmode="decimal" value="121.499588" placeholder="经度 lon">
</div>
<button class="btn sec" id="btnManual" disabled>发送手动坐标</button>
<div id="status">打开后点“连接蓝牙”，在弹出的蓝牙列表中选择 AI-Passport。</div>
<script>
var SERVICE = '0000fff0-0000-1000-8000-00805f9b34fb';  // 固件服务 0xFFF0（Web Bluetooth 需完整 UUID）
var CHAR    = '0000fff1-0000-1000-8000-00805f9b34fb';  // 固件可写特征 0xFFF1
var btnC=document.getElementById('btnConnect');
var btnG=document.getElementById('btnGps');
var btnM=document.getElementById('btnManual');
var inLat=document.getElementById('inLat'), inLon=document.getElementById('inLon');
var st=document.getElementById('status');
var char=null, deviceName='';

function log(t,c){ st.className=c||'info'; st.textContent=t; }

/* ===== 统一写坐标 ===== */
function sendCoord(lat, lon, note){
  if(!char){ log('请先连接蓝牙。','err'); return; }
  var ts=Math.floor(Date.now()/1000);
  var payload=lat+','+lon+','+ts;
  log('正在写入工牌… '+payload);
  var data=new TextEncoder().encode(payload);
  var p=char.writeValueWithResponse ? char.writeValueWithResponse(data) : char.writeValue(data);
  p.then(function(){
    log('已发送：纬度 '+lat+'  经度 '+lon+'\n时间 '+new Date(ts*1000).toLocaleString()+
        (note?'\n'+note:'')+'\n工牌星图位置已更新。','ok');
  }).catch(function(e){ log('发送失败：'+e.message,'err'); });
}

/* ===== 蓝牙连接 ===== */
btnC.onclick = async function(){
  if(!navigator.bluetooth){ log('此浏览器不支持 Web Bluetooth，请用 Chrome / Edge 打开。','err'); return; }
  try{
    log('请在弹出列表中选择 AI 工牌（AI-Passport）…');
    var device=await navigator.bluetooth.requestDevice({filters:[{services:[SERVICE]}], optionalServices:[SERVICE]});
    deviceName=device.name||'工牌';
    log('已选择：'+deviceName+'，正在连接…');
    var server=await device.gatt.connect();
    var svc=await server.getPrimaryService(SERVICE);
    char=await svc.getCharacteristic(CHAR);
    btnG.disabled=false; btnM.disabled=false;
    log('已连接 '+deviceName+'。可点“发送我的位置”，或用下方手动坐标。','ok');
    device.addEventListener('gattserverdisconnected', function(){
      char=null; btnG.disabled=true; btnM.disabled=true;
      log('蓝牙已断开，请重新点“连接蓝牙”。','err');
    });
  }catch(e){ log('连接失败：'+e.message,'err'); }
};

/* ===== 浏览器定位：先高精度，失败降级低精度；带硬超时兜底 ===== */
function geoErrText(e){
  if(e && e.code===1) return '定位权限被拒绝。请到 系统设置→应用→浏览器→权限→位置，选“允许/精确位置”，并打开系统定位。';
  if(e && e.code===2) return '浏览器没有可用的定位源（手机常因缺 Google 服务，电脑常因系统位置服务关闭）。请直接用下方手动坐标。';
  if(e && e.code===3) return '定位超时（室内/GPS 信号弱或电脑无定位硬件）。可到开阔处重试，或直接用下方手动坐标。';
  return '定位失败：'+(e&&e.message?e.message:'未知错误')+'。可改用下方手动坐标。';
}
function attempt(high, cb){
  navigator.geolocation.getCurrentPosition(cb, function(err){
    if(high){ log('高精度定位未成功，尝试网络/低精度定位…','info'); attempt(false,cb); }
    else cb({__err:err});
  }, { enableHighAccuracy:high, timeout:20000, maximumAge:30000 });
}
btnG.onclick = function(){
  if(!char){ log('请先连接蓝牙。','err'); return; }
  if(!navigator.geolocation){ log('此浏览器不支持定位，请用下方手动坐标。','err'); return; }
  log('正在获取定位（最多约 25 秒，电脑/室内较慢）…');
  var done=false;
  var hard=setTimeout(function(){
    if(done) return; done=true;
    log('定位长时间无响应。电脑若没开系统位置服务会这样，请直接用下方手动坐标。','err');
  }, 26000);
  attempt(true, function(pos){
    if(done) return; done=true; clearTimeout(hard);
    if(pos.__err){ log(geoErrText(pos.__err),'err'); return; }
    var c=pos.coords;
    var lat=c.latitude.toFixed(6), lon=c.longitude.toFixed(6);
    inLat.value=lat; inLon.value=lon;
    sendCoord(lat, lon, '定位精度约 '+Math.round(c.accuracy)+' 米');
  });
};

/* ===== 手动坐标 ===== */
btnM.onclick = function(){
  var lat=parseFloat(inLat.value), lon=parseFloat(inLon.value);
  if(isNaN(lat)||isNaN(lon)||Math.abs(lat)>90||Math.abs(lon)>180){
    log('请输入有效经纬度（纬度 -90~90，经度 -180~180）。','err'); return;
  }
  sendCoord(lat.toFixed(6), lon.toFixed(6), '手动坐标');
};
</script>
</body>
</html>
