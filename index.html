<!DOCTYPE html>
<html lang="zh">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>AI 工牌定位推送</title>
<style>
  body{font-family:system-ui,-apple-system,sans-serif;background:#0b0f14;color:#e6eef7;margin:0;padding:16px;max-width:480px;margin:0 auto}
  h1{font-size:20px;margin:0 0 6px}
  p{font-size:13px;color:#9aa7b5;margin:4px 0 12px}
  .btn{display:block;width:100%;padding:14px;margin:10px 0;font-size:16px;border:none;border-radius:10px;cursor:pointer;background:#2d5bff;color:#fff}
  .btn:disabled{background:#333;color:#777;cursor:default}
  #status{font-size:14px;margin-top:14px;line-height:1.5;white-space:pre-wrap;word-break:break-all}
  .ok{color:#4caf50}.err{color:#ff5252}.info{color:#9aa7b5}
</style>
</head>
<body>
<h1>AI 工牌 · 定位推送</h1>
<p>把手机当前位置（GPS）与时间发送到 AI 工牌，用于星图定位。需使用 Chrome / Edge 打开。</p>
<button class="btn" id="btnConnect">1. 连接工牌</button>
<button class="btn" id="btnSend" disabled>2. 发送我的位置</button>
<div id="status">打开后点上方按钮，在弹出的蓝牙列表中选择 AI 工牌。</div>
<script>
var SERVICE = '0000fff0-0000-1000-8000-00805f9b34fb';  // 与固件 BLE 服务 0xFFF0 一致（Web Bluetooth 需完整 128 位 UUID）
var CHAR    = '0000fff1-0000-1000-8000-00805f9b34fb';  // 与固件可写特征 0xFFF1 一致
var btnC = document.getElementById('btnConnect');
var btnS = document.getElementById('btnSend');
var st   = document.getElementById('status');
var char = null;

function log(t, c){ st.className = c || 'info'; st.textContent = t; }

btnC.onclick = async function(){
  if(!navigator.bluetooth){ log('此浏览器不支持 Web Bluetooth，请用手机 Chrome 或 Edge 打开本页。', 'err'); return; }
  try{
    log('请在弹出列表中选择 AI 工牌（Passport）…');
    var device = await navigator.bluetooth.requestDevice({ filters:[{ services:[SERVICE] }], optionalServices:[SERVICE] });
    log('已选择：' + device.name + '，正在连接…');
    var server = await device.gatt.connect();
    var svc = await server.getPrimaryService(SERVICE);
    char = await svc.getCharacteristic(CHAR);
    btnS.disabled = false;
    log('已连接 ' + device.name + '。点"发送我的位置"，坐标和时间将写入工牌。', 'ok');
  }catch(e){ log('连接失败：' + e.message, 'err'); }
};

btnS.onclick = function(){
  if(!navigator.geolocation){ log('此浏览器不支持定位。', 'err'); return; }
  if(!char){ log('请先连接工牌。', 'err'); return; }
  log('正在获取定位…');
  navigator.geolocation.getCurrentPosition(function(pos){
    var lat = pos.coords.latitude.toFixed(6);
    var lon = pos.coords.longitude.toFixed(6);
    var ts  = Math.floor(Date.now()/1000);
    var data = new TextEncoder().encode(lat + ',' + lon + ',' + ts);
    char.writeValue(data).then(function(){
      log('已发送：纬度 ' + lat + '  经度 ' + lon + '\n时间 ' + new Date(ts*1000).toLocaleString() + '\n工牌星图位置已更新。', 'ok');
    }).catch(function(e){ log('发送失败：' + e.message, 'err'); });
  }, function(e){ log('定位失败：' + e.message + '（请在浏览器允许定位权限）', 'err'); }, { enableHighAccuracy:true, timeout:10000 });
};
</script>
</body>
</html>
